# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: student-performance
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    # deploy a new commit only once the GitHub Actions CI (tests + docker smoke test) has passed
    autoDeployTrigger: checksPass
